# My Fitness 365 — Netlify config (v1). Use with a Netlify site whose
# "Base directory" is my-fitness-365. Does not affect the Oakham site at the repo root.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA routing: every path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"
    X-Frame-Options = "DENY"
